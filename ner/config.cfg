[paths]
train = "./train.spacy"
dev = "./dev.spacy"

[nlp]
lang = "en"
pipeline = ["tok2vec","ner","relation_extractor"]
batch_size = 128

[components]

[components.tok2vec]
factory = "tok2vec"

[components.tok2vec.model]
@architectures = "spacy.Tok2Vec.v2"

[components.tok2vec.model.embed]
@architectures = "spacy.MultiHashEmbed.v2"
width = 96
rows = [5000, 2000, 1000, 1000, 1000, 1000]
attrs = ["NORM", "PREFIX", "SUFFIX", "SHAPE", "ID", "ORTH"]
include_static_vectors = false

[components.tok2vec.model.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = ${components.tok2vec.model.embed.width}
depth = 4
window_size = 1
maxout_pieces = 3

[components.ner]
factory = "ner"

[components.relation_extractor]
factory = "relation_extractor"

[components.relation_extractor.model]
@architectures = "spacy.RelationExtractor.v1"
nO = null   # will be filled automatically
nI = null
tok2vec = null
hidden_size = 64

[training]
train_corpus = "corpora.train"
dev_corpus = "corpora.dev"
seed = 42
dropout = 0.2
max_epochs = 20
patience = 1600
eval_frequency = 200
frozen_components = []
accumulate_gradient = 1

[training.gpu_allocator]
@allocators = "spacy.GpuAllocator.v1"



[training.optimizer]
@optimizers = "Adam.v1"
learn_rate = 0.001
L2_is_weight_decay = true
beta1 = 0.9
beta2 = 0.999
eps = 1e-08

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
size = 2000
discard_oversize = true
tolerance = 0.2

[corpora]

[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}

[initialize]

[initialize.components]

[initialize.components.ner]
labels = null

[initialize.components.relation_extractor]
labels = null

[initialize.tokenizer]

